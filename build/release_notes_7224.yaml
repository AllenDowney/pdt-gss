              SPOUSE1-SPOUSE5, PARENT1-PARENT5, CHILD1-CHILD5, OTHFAM1-OTHFAM5,
              COWORK1-COWORK5, MEMGRP1-MEMGRP5, NEIGHBR1-NEIGHBR5, FRIEND1-FRIEND5,
              ADVISOR1-ADVISOR5, OTHER1-OTHER5, TALKTO1-TALKTO5, TOPPROB1_NEXT,
              TOPPROB2_HLTH, TOPPROB2_EDUC, TOPPROB2_CRIM, TOPPROB2_ENVR,
              TOPPROB2_IMMG, TOPPROB2_ECON, TOPPROB2_TERR, TOPPROB2_POVT,
              TOPPROB2_NONE, HHTYPE1_NEXT, FAMGEN_NEXT]
  issue: >-
    Variables not previously released addressing: Interviewer characteristics;
    Interviewer observations; Interview length, incentives, and other paradata;
    Respondent skin-tone (interviewer-observed and self-reported); WORDSUM variants;
    ANES follow-on eligibility and participation; GSS Next Follow-on, with sections
