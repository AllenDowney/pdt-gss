- release: 7224r3
  page: 6
  years: [2024]
  variables: [RACWORK]
  issue: >-
    The question RACWORK was removed from the 2024 questionnaire. There should have
    been no valid or missing values.
  fix: Recoded to .y "Not available in this year"
  links: [{each: [same_item, data_revised]}]

- release: 7224r3
  page: 6
  years: [2022, 2024]
  variables: [RACOPEN, RACOPENV]
  issue: >-
    In implementing the transition from RACOPENY to RACOPENV (see Release Notes for
    Release 1 below), we did not appropriately move over in-person, phone, and
    select multimode cases to RACOPEN.
  fix: Corrected
  links: [{each: [same_item, data_revised]}]

- release: 7224r3
  page: 6
  years: [2022, 2024]
  variables: [AGED, AGEDV, AGEDNV, COURTS, COURTSV, COURTSNV, DISCAFFW, DISCAFFWV,
              DISCAFFWNV, DIVLAW, DIVLAWV, DIVLAWNV, FAIR, FAIRV, FAIRNV, FEPOL,
              FEPOLV, FEPOLNV, GRASS, GRASSV, GRASSNV, HELPFUL, HELPFULV, HELPFULNV,
              KIDSSOL, KIDSSOLV, KIDSSOLNV, POSTLIFE, POSTLIFEV, POSTLIFENV, PRAYER,
              PRAYERV, PRAYERNV, RELITEN, RELITENV, RELITENNV, TRUST, TRUSTV, TRUSTNV,
              USWARY, USWARYV, USWARYNV]
  issue: >-
    Based on the mode of completion (variable: MODE), some cases were not
    appropriately assigned to the correct experimental version of the variable
    corresponding to the volunteered response experiment. Upon further
    investigation, we discovered mode assignments needed to be adjusted for certain
    variables, particularly for certain ballots. In addition, we discovered a
    programming anomaly where a select number of web respondents assigned to the NV
    condition (FORM=1) were able to return to a V/NV variable a second time and were
    shown and able to select a volunteer response option not available to them by
    the experimental design. It was determined that these cases should be recoded
    to .n "No Answer" to preserve the experimental design.
  fix: Corrected
  links: [{each: [same_item, data_revised]}]

- release: 7224r3
  page: 6-7
  years: [2021, 2022]
  variables: [MODE]
  issue: >-
    While investigating the volunteered response experiment discrepancies (see
    above), we determined that 218 cases in 2021 and 19 cases in 2022 (237 total)
    would be better classified as "Multimode." This change for 2021 makes it more
    consistent with mode assignment in 2022 and 2024.
  fix: Recoded to 3 "Multimode"
  links: [{each: [same_item, data_revised]}]

- release: 7224r3
  page: 7
  years: [2022]
  variables: [CONSENT]
  issue: >-
    While processing the 2024 GSS variable of CONSENT, an error was discovered in
    the 2022 processing.
  fix: Corrected
  links: [{each: [same_item, data_revised]}]

- release: 7224r3
  page: 7
  years: [2006-2018]
  variables: [RADIOACT]
  issue: This variable was assigned an incorrect variable label inconsistent with the content.
  fix: Corrected
  # A corrected variable label is a documentation change; no §5.2 relation
  # describes it, so the link says only same_item and the note carries the fix.
  links: [{each: [same_item]}]

- release: 7224r3
  page: 7
  years: [1993]
  variables: [IMPTHNGS]
  issue: >-
    This variable was assigned an incorrect set of response labels inconsistent with
    the question.
  fix: Corrected
  links: [{each: [same_item, codes_changed]}]

# --- Release 2 (pages 8-12) ---------------------------------------------------

- release: 7224r2
  page: 8
  years: all
  variables: [AGEKDBRN, BABIES, BABIES_EXP, CHILDSINHH, CHILDS_EXP, CODEN, DENOM,
              DENOM16, DIPGED, FAMGEN, FAMGEN_EXP, HIVTEST1, HIVTEST2, HOMPOP,
              HOMPOP_EXP, MAJOR1, MAJOR2, OTHLANG1, OTHLANG2, PARTNERS, PRETEEN,
              PRETEEN_EXP, RACEACS14, REGION, REG16, RPLACE, SPDEN, TEENS, TEENS_EXP,
              UNRELAT]
  issue: >-
    The GSS team developed an updated plan for the 2024 data release to reduce
    disclosure risks, especially for demographic and topic-sensitive variables. The
    GSS team has chosen to reduce the number of response categories reported for
    select demographic variables. The default variable names (e.g., EARNRS,
    HISPANIC) will have the reduced response option responses for all available
    years. New variables will contain the historically released responses using a
    standard suffix format of _XXYY, where XX represents the last two digits of the
    first year that the variable was active, and YY represents the last two digits
    of the last year that the variable was active (e.g., _0022 designates the trend
    was active from 2000 to 2022). For more information about these changes, please
    see Appendix E in the GSS 2024 Codebook.
  fix: >-
    Updated response categories. Variables preserving the historical response
    categories: AGEKDBRN_9422, BABIES_7222, BABIES_EXP_22, CHILDSINHH_2122,
    CHILDS_EXP_22, CODEN_1222, DENOM_7222, DENOM16_7322, DIPGED_1222, FAMGEN_7522,
    FAMGEN_EXP_22, HIVTEST1_0622, HIVTEST2_0622, HOMPOP_7222, HOMPOP_EXP_22,
    MAJOR1_1222, MAJOR2_1222, OTHLANG1_0022, OTHLANG2_0022, PARTNERS_8822,
    PRETEEN_7222, PRETEEN_EXP_22, RACEACS14_2122, REGION_7222, REG16_7222,
    RPLACE_7522, SPDEN_7322, TEENS_7222, TEENS_EXP_22, UNRELAT_7222
  links:
    - each: [same_item, codes_changed]
    - pairs: [[agekdbrn, agekdbrn_9422], [babies, babies_7222], [babies_exp, babies_exp_22],
              [childsinhh, childsinhh_2122], [childs_exp, childs_exp_22], [coden, coden_1222],
              [denom, denom_7222], [denom16, denom16_7322], [dipged, dipged_1222],
              [famgen, famgen_7522], [famgen_exp, famgen_exp_22], [hivtest1, hivtest1_0622],
              [hivtest2, hivtest2_0622], [hompop, hompop_7222], [hompop_exp, hompop_exp_22],
              [major1, major1_1222], [major2, major2_1222], [othlang1, othlang1_0022],
              [othlang2, othlang2_0022], [partners, partners_8822], [preteen, preteen_7222],
              [preteen_exp, preteen_exp_22], [raceacs14, raceacs14_2122], [region, region_7222],
              [reg16, reg16_7222], [rplace, rplace_7522], [spden, spden_7322],
              [teens, teens_7222], [teens_exp, teens_exp_22], [unrelat, unrelat_7222]]
      relations: [same_item, renamed]

- release: 7224r2
  page: 9
  years: [2024]
  variables: [RACECEN1, RACECEN2, RACECEN3]
  issue: >-
    In R1, we released a version which only had six categories (e.g., all Asian
    subgroups were grouped together). With additional time to review disclosure
    risk, we determined that there were sufficient protections to release a version
    of these variables which included all Asian subgroups.
  fix: Expanded response categories
  links: [{each: [same_item, codes_changed, data_revised]}]

- release: 7224r2
  page: 9
  years: [2024]
  variables: [ADULTSINHH]
  issue: >-
    During the R1 coding of ADULTSINHH, 24 cases did not properly account for
    information from the full household composition series which had not been fully
    processed yet as of R1.
  fix: Corrected
  links: [{each: [same_item, data_revised]}]

- release: 7224r2
  page: 9
  years: [2024]
  variables: [ETHREGION22]
  issue: >-
    In conjunction with our revised disclosure risk, all ETHREGION variables were
