# --- Release 1 (pages 13-15) --------------------------------------------------
# Release 1's previous release is a 1972-2022 cumulative file whose release id the
# notes don't give, and this repo has no data file for it, so these entries make
# no links yet. They are transcribed so the renames are on record.

- release: 7224r1
  page: 13
  years: all
  variables: [EARNRS, HISPANIC, NUMEMPS, RACECEN1, RACECEN2, RACECEN3, SIBS, USCITZN]
  issue: >-
    The GSS team developed an updated plan for the 2024 data release to reduce
    disclosure risks, especially for demographic variables. The GSS team has chosen
    to reduce the number of response categories reported for select demographic
    variables. The default variable names (e.g., EARNRS, HISPANIC) will have the
    reduced response option responses for all available years. New variables will
    contain the historically released responses using a standard suffix format of
    _XXYY, where XX represents the last two digits of the first year that the
    variable was active, and YY represents the last two digits of the last year that
    the variable was active (e.g., _0022 designates the trend was active from 2000
    to 2022). For more information about these changes, please see Appendix E in
    the GSS 2024 Codebook.
  fix: >-
    Updated response categories. Variables preserving the historical response
    categories: EARNRS_7222, HISPANIC_0022, NUMEMPS_0422, RACECEN1_0022,
    RACECEN2_0022, RACECEN3_0022, SIBS_7222, USCITZN_0822
  links:
    - each: [same_item, codes_changed]
    - pairs: [[earnrs, earnrs_7222], [hispanic, hispanic_0022], [numemps, numemps_0422],
              [racecen1, racecen1_0022], [racecen2, racecen2_0022], [racecen3, racecen3_0022],
              [sibs, sibs_7222], [uscitzn, uscitzn_0822]]
      relations: [same_item, renamed]

- release: 7224r1
  page: 13
  years: multiple
  variables: [MARHOMO, MARHOMO1, MARSAME, MARSAME1]
  issue: Updated the name of MARHOMO to be MARSAME, and MARHOMO1 to be MARSAME1.
  fix: Updated
  links:
    - pairs: [[marhomo, marsame], [marhomo1, marsame1]]
      relations: [same_item, renamed]

- release: 7224r1
  page: 13
  years: [2022]
  variables: [CHNGTME, CHNGTIME]
  issue: >-
    The variable name for CHNGTME was changed in 2022 to CHNGTIME to be consistent
    with the variable name in the questionnaire. Given no changes in the question
    wording or response options were implemented in association with this change,
    the responses from CHNGTIME should be moved into CHNGTME to increase ease of
    analysis of this variable over time.
  fix: Responses from CHNGTIME moved into CHNGTME. CHNGTIME removed
  links:
    - pairs: [[chngtme, chngtme]]
      relations: [same_item, data_revised]
    - pairs: [[chngtime, chngtme]]
      relations: [merged_into]

- release: 7224r1
  page: 13
  years: [2022]
  variables: [NEAELIGIBLE, NEXTELIGIBLE]
  issue: >-
    NEASTATUS and NEXTSTATUS previously reported which cases completed the NEA
    follow-on and GSS Next follow-on, respectively. This indicator did not provide
    information regarding who was eligible to participate in the follow-on.
  fix: Included
  why: New variables; nothing in the previous release to link to.

- release: 7224r1
  page: 14
  years: [2022]
  variables: [NMBRKIDS]
  issue: >-
    An error exporting the "None" check box responses unexpectedly incorporated a
    value of 1 into the numeric field for this variable for 459 cases when it should
    have been reported as 0.
  fix: Recoded to 0
  links: [{each: [same_item, data_revised]}]

- release: 7224r1
  page: 14
  years: [2022]
  variables: [RACOPENV, RACOPENY]
  issue: >-
    Question RACOPEN is included in two experiments (gender-neutral wording and
    volunteered response). Per the 2022 GSS Codebook, RACOPENV was designated as the
    reported variable containing data for both experiment "as the -V and -NV effect
    appears stronger." Despite this assertion, the variable was released as
    RACOPENY.
  fix: Responses from RACOPENY moved to RACOPENV. RACOPENY removed
  links:
    - pairs: [[racopenv, racopenv]]
      relations: [same_item, data_revised]
    - pairs: [[racopeny, racopenv]]
      relations: [merged_into]

- release: 7224r1
  page: 14
  years: [2022]
  variables: [WRKSTAT, SPWRKSTA]
  issue: >-
    Verbatim answers to WRKSTAT and SPWRKSTA option 5 "Other" were not recoded into
    WRKSTAT and SPWRKSTA categories 1-7.
  fix: 19 verbatim answers for WRKSTAT were recoded and 11 verbatim answers for SPWRKSTA were recoded
  links: [{each: [same_item, data_revised]}]

