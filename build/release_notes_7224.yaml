# NORC's "Release Notes for GSS 1972-2024 Release 3a" (July 2026), transcribed by
# hand. That PDF repeats the notes for Releases 3, 2 and 1, so one source covers
# all four. build/build_links.py turns these entries into metadata/links.jsonl.
#
# What is transcribed (origin: publisher, source below, page = the PDF's page):
#   years, variables (as printed, upper case, ranges like INTRACE1-INTRACE3 kept),
#   issue and fix (verbatim, with line breaks from page width removed).
# What is ours (origin: hand, recorded in each link's note):
#   `links`, the reading of each entry as STANDARD.md §5.2 relations.
#
# links: a list of
#   - each: [relations]            every listed variable, same name, previous release -> this release
#   - pairs: [[from, to], ...]     names (lower case); from in `from_release`, to in `to_release`
#     relations: [...]             (both default: previous release -> this release)
# An entry with no `links` asserts nothing we can model; `why` says why.

source: gss-release-notes-7224r3a
author: Allen Downey
transcribed_on: "2026-11-19"

# Names printed wrong in the notes, kept as printed in `variables` and mapped here
# when links are built (origin: hand; checked against the R2, R3 and R3a Stata files).
name_fixes:
  DSDNTPAY:
    name: DSNDNTPAY
    note: >-
      Release 2 notes (p. 10) print DSDNTPAY; the data files of R2, R3 and R3a have
      dsndntpay, "Reparations for descendants of slaves", and no dsdntpay.

releases:
  7224r3a: {label: Release 3a, date: "2026-07", previous: 7224r3}
  7224r3:  {label: Release 3,  date: "2026-03", previous: 7224r2}
  7224r2:  {label: Release 2,  date: "2025-10", previous: 7224r1}
  7224r1:  {label: Release 1,  date: "2025-05", previous: null,
            note: "Its previous release is a 1972-2022 cumulative file; the notes don't name which release of it."}

entries:

# --- Release 3a (pages 1-2) ---------------------------------------------------

- release: 7224r3a
  page: 1
  years: [2024]
  variables: [DWELLPRE, USCITZNV, USCITZNNV]
  issue: >-
    Due to recent disclosure review and limitation decisions, these variables have
    been denoted as .x "Not available in this release" but should be denoted as .y
    "Not available in this year."
  fix: Recoded to .y "Not available in this year"
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 1
  years: [2024]
  variables: [RACOPEN, RACOPENV]
  issue: >-
    For the R3 release of the 2024 data, a correction was intended for RACOPENV for
    2024 related to RACOPENY. Unfortunately, the data for RACOPEN and RACOPENV was
    inadvertently removed as a part of that intended correction.
  fix: Included
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 1
  years: [2024]
  variables: [RVISITOR]
  issue: Variable not previously released
  fix: Included
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 1
  years: [2021]
  variables: [INTID, INTETHN, INTHISP, INTRACE1-INTRACE3, INTSEX]
  issue: >-
    While the GSS team had hoped to provide telephone interviewer characteristics
    for 2021, these data were ultimately not able to be obtained. These variables
    have been denoted as .x "Not available in this release" but should be denoted
    as .y "Not available in this year."
  fix: Recoded to .y "Not available in this year"
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 1
  years: [2021]
  variables: [SPPRES80]
  issue: >-
    This variable has not been produced since 2010 and was not intended for release
    in 2021. These variables should be denoted as .y "Not available in this year."
  fix: Recoded to .y "Not available in this year"
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 1
  years: [2021]
  variables: [STRVBIAS, STRVBIASY]
  issue: >-
    In 2021, a question wording experiment (assigned by FORM) was conducted on the
    variable STRVBIAS to ensure the response option order did not have an impact on
    response distributions. The order was found to have no impact on response
    distributions. Consistent with GSS policy for other variables where similar
    experiments have been conducted (including the same experiment for the
    2016-2020 GSS Panel), STRVBIASY should be integrated into STRVBIAS.
  fix: STRVBIAS expanded, STRVBIASY removed
  links:
    - pairs: [[strvbias, strvbias]]
      relations: [same_item, data_revised]
    - pairs: [[strvbiasy, strvbias]]
      relations: [merged_into]

- release: 7224r3a
  page: 1
  years: [2021, 2022, 2024]
  variables: [ISCO08, PAISCO08, MAISCO08, SPISCO08, COISCO08]
  issue: Variables not previously released
  fix: Included
  links: [{each: [same_item, data_revised]}]

- release: 7224r3a
  page: 2
  years: all
  variables: [VOTE_TS, PRES_TS]
  issue: >-
    In the spirit of recent "time series" additions (i.e., suffix "TS") for the ANES
    module, we have added two time series variables for our historical voting
    (e.g., VOTE68, VOTE92, VOTE20) and presidential voting (e.g., PRES68, PRES92,
    PRES20) questions. This variable summarizes the data from the most recent
    election as some years asked about multiple elections. For example, for GSS
    2024, VOTE_TS and PRES_TS include the voting data for the 2020 election as
    respondents were asked about both the 2016 and 2020 elections.
  fix: Included
  # The 2024 codebook (R3a, p. 457) says "GSS variables VOTE68 through VOTE20 were
  # combined to construct VOTE_TS" and the same for PRES_TS. The members of each
  # range are the names in the R3a data file that match vote<yy> and pres<yy>.
  links:
    - from_release: 7224r3a
      to_release: 7224r3a
      pairs: [[vote_ts, vote68], [vote_ts, vote72], [vote_ts, vote76], [vote_ts, vote80],
              [vote_ts, vote84], [vote_ts, vote88], [vote_ts, vote92], [vote_ts, vote96],
              [vote_ts, vote00], [vote_ts, vote04], [vote_ts, vote08], [vote_ts, vote12],
              [vote_ts, vote16], [vote_ts, vote20],
              [pres_ts, pres68], [pres_ts, pres72], [pres_ts, pres76], [pres_ts, pres80],
              [pres_ts, pres84], [pres_ts, pres88], [pres_ts, pres92], [pres_ts, pres96],
              [pres_ts, pres00], [pres_ts, pres04], [pres_ts, pres08], [pres_ts, pres12],
              [pres_ts, pres16], [pres_ts, pres20]]
      relations: [derived_from]

# --- Release 3 (pages 3-7) ----------------------------------------------------

- release: 7224r3
  page: 3
  years: all
  variables: [DWELLING, INTAGE, INTYRS]
  issue: >-
    The GSS team developed an updated plan for the 2024 data release to reduce
    disclosure risks, especially for demographic and topic-sensitive variables. See
    a fuller description in Release Notes for Release 1 and Release 2. For more
    information about these changes, please see Appendix E in the GSS 2024 Codebook.
  fix: >-
    Updated response categories. Variables preserving the historical response
    categories: DWELLING_8222, INTAGE_0418, INTYRS_0418
  links:
    - pairs: [[dwelling, dwelling], [intage, intage], [intyrs, intyrs]]
      relations: [same_item, codes_changed]
    - pairs: [[dwelling, dwelling_8222], [intage, intage_0418], [intyrs, intyrs_0418]]
      relations: [same_item, renamed]

- release: 7224r3
  page: 3
  years: [2024]
  variables: [YEARSUSA, MNTHSUSA, MIGAGE, MIGHIST]
  issue: >-
    Related to disclosure risks (see above), it was determined that YEARSUSA and
    MNTHSUSA should no longer be released as is in the public use datafile. In
    response, the GSS team developed two summary measures based on this data
    appropriate for public release. MIGAGE provides age categories for when the
    respondent immigrated to the United States. MIGHIST provides the year range of
    the respondent's immigration based on major periods of immigration in the U.S.
    For more information, please see GSS Methodological Report 144.
  fix: Included
  links:
    - from_release: 7224r3
      to_release: 7224r3
      pairs: [[migage, yearsusa], [migage, mnthsusa], [mighist, yearsusa], [mighist, mnthsusa]]
      relations: [derived_from]
    - pairs: [[yearsusa, yearsusa], [mnthsusa, mnthsusa]]
      relations: [same_item, data_revised]

- release: 7224r3
  page: 3
  years: [2024]
  variables: [AMERSTATUS, BASELINESTATUS, WTSSNRPS_AS]
  issue: >-
    In addition to the nationally representative sample, the 2024 GSS Cross-section
    includes an oversample of Black, Hispanic, and Asian American, Native Hawaiian,
    and Pacific Islander (AANHPI) respondents, obtained from NORC's AmeriSpeak
    Panel, which utilizes the same national sampling frame as the GSS. These
    respondents were not eligible for follow-on GSS studies. AmeriSpeak Panel cases
    were not included in previous releases. For more details, please see GSS
    Methodological Report 148.
  fix: >-
    677 AmeriSpeak respondents are now included, increasing the final sample size
    for 2024 to 3,986 respondents. AmeriSpeak cases are denoted by the indicator
    AMERSTATUS. Baseline 2024 GSS cases are denoted by the indicator BASELINESTATUS.
    AmeriSpeak cases are only available in the 2024 GSS single-year file, not the
    1972-2024 cumulative file. The full 3,986 respondents should be analyzed with
    the survey weight WTSSNRPS_AS.
  why: These variables are in the 2024 single-year file only, not the cumulative file this repo covers.

- release: 7224r3
  page: 3-6
  years: [2024]
  variables: [INTID, INTAGE, INTETHN, INTSEX, INTYRS, COOP, COMPREND, HUCLEAN,
              WHOELSE1-WHOELSE6, HLTHSTRT, KIDSINHH, RESPOND, INCUSPOP, NEISAFE,
              RLOOKS, RGROOMED, RHLTHEND, FEEUSED, FEELEVEL, TOTALINCENTIVE,
              LNGTHINV, CONSENT, ADMINCONSENT, BATCH, OVERSAMP, RELTRAD16, WORDSUM7,
              WORDSUMOLD, WORDSUMNEW, ANESELIGIBLE, ANESPRE_STATUS, ANESPOST_STATUS,
              NEXTELIGIBLE, NEXTSTATUS, WTSSNRPS_NEXT, DATEINTV_NEXT, CREDREP,
              CREDCHOICE, CREDAM, CREDLAND, CREDEMP, CREDCAR, IMPFINAN, IMPMAR,
              IMPKIDS, IMPGOD, IMPTHNGS, IMPCULTR, IMPJOB, IMPSELF, UNITED,
