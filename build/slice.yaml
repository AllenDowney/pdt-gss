# The snake_case slice of the GSS (PublicDataToolkit Task 5, step 2).
# Hand-entered facts here are recorded with origin: hand.

# Releases built from the same documentation, gssrdoc 0.9 (Release 3), each with
# its own Stata file. 7224r3a has no gssrdoc version of its own yet (Task 21).
releases:
  "7224r3":
    stata: gss7224_r3.dta.gz
    stata_source: gss-stata-7224r3
  "7224r3a":
    stata: gss7224_r3a.dta.gz
    stata_source: gss-stata-7224r3a
    documented_by: 7224r3
author: Allen Downey
date: "2026-11-19"

# 50 variables: design variables, two complete batteries, two ballot-split
# items, the race items with known corrections, and a few others, including
# grass (marijuana), and religion items for the cross-survey topic query
# (religion, chosen 2026-11-19).
variables:
  design: [year, id, ballot, mode, wtssps, age, sex]
  abortion_battery: [abdefect, abnomore, abhlth, abpoor, abrape, absingle, abany]
  spending_battery: [natspac, natenvir, natheal, natcity, natcrime, natdrug, nateduc,
                     natrace, natarms, nataid, natfare, natroad, natsoc, natmass,
                     natpark, natchld, natsci, natenrgy]
  ballot_split: [natracey, natfarey]
  race: [racopen, racfew, rachaf, racmost, racschol]
  other: [grass, homosex, cappun, gunlaw, polviews, partyid]
  religion: [relig, attend, reliten, pray, bible]

# What kind of quantity each variable's valid values are (STANDARD.md §4.1).
measure:
  identifier: [id]
  weight: [wtssps]
  continuous: [age, year]
  ordinal: [polviews, homosex, attend, reliten, pray,
            natspac, natenvir, natheal, natcity, natcrime, natdrug, nateduc,
            natrace, natarms, nataid, natfare, natroad, natsoc, natmass,
            natpark, natchld, natsci, natenrgy, natracey, natfarey]
  categorical: [ballot, mode, sex,
                abdefect, abnomore, abhlth, abpoor, abrape, absingle, abany,
                racopen, racfew, rachaf, racmost, racschol,
                grass, cappun, gunlaw, partyid, relig, bible]

# Ends of valid ranges that are top- or bottom-coded.
top_coded:
  age: "89 means 89 or older."
