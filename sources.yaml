sources:
  - id: gssrdoc-json
    title: gssrdoc gss_doc table, converted to JSON (gssrdoc_full.json)
    kind: upstream_package
    format: json
    url: https://github.com/kjhealy/gssrdoc
    path: data/raw/gssrdoc_full.json
    releases: [7224r3a]
    redistribution: ship
    acquisition: manual
    manual_steps: >
      Install gssrdoc, then run codebook/convert_gssrdoc_to_json.R from the
      CultureWar repo (https://github.com/AllenDowney/CultureWar), which writes
      extracted/gssrdoc_full.json. To be replaced by a pinned conversion in
      build/.
    fetched_on: "2026-02-07"
    sha256: 93bc1791b1325cbc9a18dae8fca94df41cf29c772371b3db9a21447b826e6fe0
    bytes: 21348980
    version: "0.8.2 (commit 26faf3f, 2025-10-28)"
    note: >
      gssrdoc scrapes GSS Data Explorer. This file was converted from gssrdoc
      0.8.2, commit 26faf3f ("Update for 1972-2024 R2 documentation"), the only
      commit to data/gss_doc.rda between 2025-10-28 and the 2026-02-07 fetch.
      It documents Release 2, not 3a: its 6,904 names are exactly those of the
      R2 Stata file, and its 2024 counts match R2 (racopen 462, grass 867).
      Found in PublicDataToolkit Task 21. gssrdoc 0.9 (commit 112286d,
      2026-03-12) documents Release 3; no version documents 3a yet.
